---
- name: Provision Ansible controller with SSH key for remote
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../group_vars/all/bind.yml
    - ../group_vars/all/vault.yml

  vars:
    ssh_key_name: ansible_remote
    # ssh_key_vault_path: "{{ vault_base_path }}/secret"
    ssh_key_vault_path: /team-unix-storage/heritage-development-eu-west-2/bind/secret

  pre_tasks:
    - debug:
        var: ssh_key_vault_path

    - debug:
        var: vault_base_path

    - debug:
        var: aws_profile

    - debug:
        msg: "{{ lookup('env', 'VAULT_ADDR') }}"

    - debug:
        msg: "ROLE_ID present"
      when: lookup('env', 'ANSIBLE_HASHI_VAULT_ROLE_ID') | length > 0

    - debug:
        msg: "SECRET_ID present"
      when: lookup('env', 'ANSIBLE_HASHI_VAULT_SECRET_ID') | length > 0

    - name: Test path 3
      debug:
        msg: >-
          {{
            lookup(
              'community.hashi_vault.hashi_vault',
              'secret=team-unix-storage/show/heritage-development-eu-west-2/bind/secret'
            )
          }}

    - name: Test Vault lookup
      block:

        - name: Retrieve secret from Vault
          ansible.builtin.set_fact:
            test_secret: >-
              {{
                lookup(
                  'community.hashi_vault.hashi_vault',
                  ssh_key_vault_path
                )
              }}

        - name: Show secret type
          ansible.builtin.debug:
            msg: "Vault lookup succeeded"

        - name: Show secret keys
          ansible.builtin.debug:
            var: test_secret

      rescue:

        - name: Vault lookup failed
          ansible.builtin.debug:
            msg: "Vault lookup failed before ssh_key role execution"

  roles:
    - role: companieshouse.general.ssh_key
